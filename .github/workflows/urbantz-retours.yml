name: Colis à retourner Urbantz (11h30-15h30)
on:
  schedule:
    - cron: '0,30 9-13 * * 1-6'   # été (UTC+2) : le script ne travaille que de 11h30 à 15h30, heure de Paris
    - cron: '0,30 10-14 * * 1-6'  # hiver (UTC+1)
  workflow_dispatch:
    inputs:
      date:
        description: 'Date des tâches (AAAA-MM-JJ), vide = aujourd’hui'
        required: false
      auto:
        description: 'Lancement planifié (respecte les horaires)'
        type: boolean
        default: false
      dry_run:
        description: "Essai à blanc (n'écrit rien)"
        type: boolean
        default: false
jobs:
  retours:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Installer les dépendances
        run: |
          mkdir work && cd work && npm init -y >/dev/null
          npm i playwright@1.49.0 @supabase/supabase-js@2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - uses: actions/checkout@v4
        with: { path: repo }
      - name: Extraire les retours
        working-directory: work
        env:
          URBANTZ_EMAIL: ${{ secrets.URBANTZ_EMAIL }}
          URBANTZ_PASSWORD: ${{ secrets.URBANTZ_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && !inputs.auto && '1' || '' }}
        run: |
          cp ../repo/scripts/urbantz-retours.mjs .
          node urbantz-retours.mjs
      - name: Capture d'écran en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: urbantz-erreur
          path: work/urbantz-erreur.png
          if-no-files-found: ignore
